{% load static tailwind_tags %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}tron.bank{% endblock %}</title>
    
    <!-- CDN & Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
    <style>
    body { background-color: #283029, font-family: 'Inter', sans-serif; color: #E4E7E5;};
    </style>
    
    <script>
    tailwind.config = {
        theme: {
            extend: {
                colors: {
                    ink:    '#0E1210',
                    inkL:   '#141A16',
                    inkLL:  '#1C2620',
                    sage:   '#22C55E',
                    sageD:  '#16A34A',
                    paper:  '#F2F0EA',
                    mist:   '#9CA39F',
                    smoke:  '#3D4A41',
                },
                fontFamily: {
                    display: ['"Space Grotesk"', 'sans-serif'],
                    body:    ['Inter', 'sans-serif'],
                    mono:    ['"Space Mono"', 'monospace'],
                },
            }
        }
    }
    </script>
    
    {% block styles %}{% endblock %}
    {% tailwind_css %}
</head>
    {% block content %}
    {% endblock %}
    {% block extra_js %}{% endblock %}
</html>
