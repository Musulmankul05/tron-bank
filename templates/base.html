{% load static tailwind_tags %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}tron.bank{% endblock %}</title>
    
    <!-- CDN & Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
    
    <!-- Глобальный конфиг Tailwind (Вынесли сюда один раз) -->
    <script>
    tailwind.config = {
        theme: {
            extend: {
                colors: {
                    ink:    '#0E1210',
                    inkL:   '#141A16',
                    inkLL:  '#1C2620',
                    sage:   '#22C55E',
                    sageD:  '#16A34A',
                    paper:  '#F2F0EA',
                    mist:   '#9CA39F',
                    smoke:  '#3D4A41',
                },
                fontFamily: {
                    display: ['"Space Grotesk"', 'sans-serif'],
                    body:    ['Inter', 'sans-serif'],
                    mono:    ['"Space Mono"', 'monospace'],
                },
            }
        }
    }
    </script>
    
    <!-- Глобальные стили темы -->
    <style>
        body { font-family: 'Inter', sans-serif; background: #0E1210; color: #F2F0EA; }
        .grid-bg {
            background-image:
            linear-gradient(rgba(34,197,94,0.01) 1px, transparent 1px),
            linear-gradient(90deg, rgba(34,197,94,0.01) 1px, transparent 1px);
            background-size: 48px 48px;
        }
        .input-focus:focus {
            border-color: rgba(34,197,94,0.4) !important;
            box-shadow: 0 0 0 1px rgba(34,197,94,0.15);
        }
        .btn-glow:hover {
            box-shadow: 0 0 0 1px rgba(34,197,94,0.4), 0 4px 20px rgba(34,197,94,0.12);
        }
    </style>
    
    {% block extra_style %}{% endblock %}
    {% tailwind_css %}
</head>
    {% block content %}
    <!-- Здесь будет контент конкретной страницы -->
    {% endblock %}
    {% block extra_js %}{% endblock %}
</html>
